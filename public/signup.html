<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | LungGuard CNN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="auth-page">
  <div class="bg">
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>
    <div class="orb orb-three"></div>
  </div>

  <main class="auth-wrap">
    <section class="card auth-card">
      <div class="brand auth-brand">
        <div class="logo">LG</div>
        <div>
          <h1>LungGuard CNN</h1>
          <p>Create your account</p>
        </div>
      </div>

      <form method="post" class="auth-form">
        <label class="field-label" for="full_name">Full Name</label>
        <input class="text-input" id="full_name" name="full_name" type="text" required />

        <label class="field-label" for="email">Email</label>
        <input class="text-input" id="email" name="email" type="email" required />

        <label class="field-label" for="password">Password</label>
        <input class="text-input" id="password" name="password" type="password" minlength="6" required />

        <label class="field-label" for="confirm_password">Confirm Password</label>
        <input class="text-input" id="confirm_password" name="confirm_password" type="password" minlength="6" required />

        <button class="primary auth-btn" type="submit">Sign Up</button>
      </form>

      <p class="auth-link">Already have an account? <a href="/login.html">Login</a></p>
    </section>
  </main>
</body>
</html>
