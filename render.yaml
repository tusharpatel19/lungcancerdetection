services:
  - type: web
    name: lungcancerdetection-l4p3
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: https://lungcancerdetection-21597.web.app
      - key: REQUIRE_API_LOGIN
        value: "false"
